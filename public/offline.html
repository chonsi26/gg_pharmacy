<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C01A1A">
<title>You're offline – GG Pharmacy</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       font-family:'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#222;background:#fff;text-align:center}
  .box{max-width:360px}
  img{width:120px;height:120px;margin-bottom:20px}
  h1{font-size:22px;font-weight:800;color:#C01A1A;margin-bottom:10px}
  p{font-size:14px;line-height:1.6;color:#666;margin-bottom:24px}
  button{background:#C01A1A;color:#fff;border:0;border-radius:6px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer}
  button:hover{background:#8B1010}
</style>
</head>
<body>
  <div class="box">
    <img src="images/logo.png" alt="GG Pharmacy">
    <h1>You're offline</h1>
    <p>We can't reach GG Pharmacy right now. Check your internet connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
