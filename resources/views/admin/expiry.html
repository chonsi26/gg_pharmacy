<style>
/* ── Expiry square cards ── */
.expiry-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.expiry-item {
  aspect-ratio: 1 / 1;
  position: relative;
  display: flex;
  flex-direction: column;
  border-radius: 14px;
  overflow: hidden;
  background: var(--surface, #fff);
  border: 1px solid var(--border, #e5e7eb);
  transition: box-shadow 0.2s, transform 0.2s;
  cursor: default;
}
.expiry-item:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(0,0,0,0.09);
}

/* Top accent bar */
.expiry-bar {
  height: 5px;
  width: 100%;
  flex-shrink: 0;
}
.expiry-item.danger  .expiry-bar { background: #ef4444; }
.expiry-item.warning .expiry-bar { background: #f97316; }
.expiry-item.ok      .expiry-bar { background: #22c55e; }

/* Card body */
.expiry-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 0;
}

/* Pill + pulse row */
.expiry-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

/* Countdown in info section */
.expiry-countdown-info {
  font-size: 10.5px;
  color: var(--muted, #6b7280);
  margin-bottom: 4px;
}
.expiry-countdown-info strong {
  font-weight: 700;
}
.expiry-item.danger  .expiry-countdown-info strong { color: #ef4444; }
.expiry-item.warning .expiry-countdown-info strong { color: #f97316; }
.expiry-item.ok      .expiry-countdown-info strong { color: #22c55e; }

/* Medicine name */
.expiry-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--text, #111827);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

/* Batch meta */
.expiry-batch {
  font-size: 10.5px;
  color: var(--muted, #6b7280);
}

/* Bottom section */
.expiry-bottom {
  border-top: 1px solid var(--border, #e5e7eb);
  padding-top: 10px;
  margin-top: auto;
}

/* Progress track */
.expiry-track {
  height: 4px;
  border-radius: 99px;
  background: var(--border, #e5e7eb);
  overflow: hidden;
  margin-top: 6px;
}
.expiry-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.9s cubic-bezier(.4,0,.2,1);
}
.expiry-item.danger  .expiry-fill { background: linear-gradient(90deg,#fca5a5,#ef4444); }
.expiry-item.warning .expiry-fill { background: linear-gradient(90deg,#fed7aa,#f97316); }
.expiry-item.ok      .expiry-fill { background: linear-gradient(90deg,#bbf7d0,#22c55e); }

.expiry-date-label {
  font-size: 10px;
  color: var(--muted, #6b7280);
  display: flex;
  justify-content: space-between;
  margin-top: 5px;
}
.expiry-item.danger  .expiry-date-label span:last-child { color: #ef4444; font-weight: 600; }
.expiry-item.warning .expiry-date-label span:last-child { color: #f97316; font-weight: 600; }
.expiry-item.ok      .expiry-date-label span:last-child { color: #22c55e; font-weight: 600; }

/* Pulse dot */
.pulse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ef4444;
  position: relative;
  flex-shrink: 0;
  display: inline-block;
}
.pulse-dot::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: #ef4444;
  opacity: 0.35;
  animation: pulse-ring 1.4s ease-out infinite;
}
@keyframes pulse-ring {
  0%   { transform: scale(1); opacity: 0.35; }
  100% { transform: scale(2.5); opacity: 0; }
}

/* Pills */
.pill { display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600; }
.pill.danger  { background:#fee2e2;color:#dc2626; }
.pill.warning { background:#ffedd5;color:#ea580c; }
.pill.ok      { background:#dcfce7;color:#16a34a; }

/* Summary row */
.expiry-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.expiry-stat {
  border-radius: 12px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  border: 1px solid var(--border, #e5e7eb);
  background: var(--surface, #fff);
}
.expiry-stat-num {
  font-size: 28px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -1px;
}
.expiry-stat-label {
  font-size: 11.5px;
  color: var(--muted, #6b7280);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.expiry-stat.red   .expiry-stat-num { color: #ef4444; }
.expiry-stat.amber .expiry-stat-num { color: #f97316; }
.expiry-stat.green .expiry-stat-num { color: #22c55e; }

.card-head { padding: 16px 20px 0; display:flex;align-items:center;justify-content:space-between; }
.card-head h3 { font-size:14px;font-weight:700;color:var(--text,#111); margin:0; }
.card-body  { padding: 16px 20px 20px; }


</style>

<script src="shared.js"></script>
<script>
const today = new Date(2025, 3, 23); // Apr 23 2025

const items = [
  {
    name:    'Amoxicillin 500mg',
    batch:   'BX-2041',
    qty:     5,
    expiry:  new Date(2025, 5, 30),
    level:   'danger',
    pill:    'Critical',
    maxDays: 90
  },
  {
    name:    'Ibuprofen 400mg',
    batch:   'BX-1998',
    qty:     32,
    expiry:  new Date(2025, 7, 15),
    level:   'warning',
    pill:    '3 Months',
    maxDays: 180
  },
  {
    name:    'Doxycycline 100mg',
    batch:   'BX-2102',
    qty:     60,
    expiry:  new Date(2025, 11, 1),
    level:   'ok',
    pill:    '6+ Months',
    maxDays: 365
  }
];

function daysBetween(a, b) {
  return Math.max(0, Math.round((b - a) / 86400000));
}

function formatExpiry(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function countdownLabel(days, level) {
  if (level === 'ok') {
    return { num: Math.round(days / 30), unit: 'months' };
  }
  if (days < 30) return { num: days, unit: 'days' };
  return { num: Math.round(days / 7), unit: 'weeks' };
}

const grid = document.getElementById('expiryGrid');

items.forEach((item) => {
  const days    = daysBetween(today, item.expiry);
  const fillPct = Math.min(100, Math.max(4, Math.round((days / item.maxDays) * 100)));
  const { num, unit } = countdownLabel(days, item.level);

  const pulseDot = item.level === 'danger'
    ? `<span class="pulse-dot"></span>`
    : '';

  const el = document.createElement('div');
  el.className = `expiry-item ${item.level}`;
  el.innerHTML = `
    <div class="expiry-bar"></div>
    <div class="expiry-body">
      <div class="expiry-top">
        <span class="pill ${item.level}">${item.pill}</span>
        ${pulseDot}
      </div>
      <div class="expiry-bottom">
        <div class="expiry-name">${item.name}</div>
        <div class="expiry-batch">${item.batch} &middot; ${item.qty} units</div>
        <div class="expiry-countdown-info">Time Left: <strong>${num} ${unit}</strong></div>
        <div class="expiry-track">
          <div class="expiry-fill" data-fill="${fillPct}" style="width:0%"></div>
        </div>
        <div class="expiry-date-label">
          <span>Expires</span>
          <span>${formatExpiry(item.expiry)}</span>
        </div>
      </div>
    </div>
  `;
  grid.appendChild(el);
});

// Animate progress fills in after paint
requestAnimationFrame(() => {
  setTimeout(() => {
    document.querySelectorAll('.expiry-fill').forEach(el => {
      el.style.width = el.dataset.fill + '%';
    });
  }, 120);
});
</script>
